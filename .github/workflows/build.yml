name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      BSML_VERSION: 1.12.5
      BSML_ASSET: BeatSaberMarkupLanguage-v1.12.5%2Bbs.1.40.0-RELEASE.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Fetches stripped Beat Saber assemblies for the version in manifest.json
      # (gameVersion: 1.40.8) into ./Refs.
      - name: Fetch Beat Saber references
        uses: beat-forge/init-beatsaber@v1
        with:
          manifest: manifest.json
          path: Refs

      # BSML is a mod, not part of the game files, so it is downloaded separately.
      # manifest.json depends on BeatSaberMarkupLanguage ^1.12.5.
      - name: Fetch BSML
        shell: pwsh
        run: |
          $url = "https://github.com/monkeymanboy/BeatSaberMarkupLanguage/releases/download/v$env:BSML_VERSION/$env:BSML_ASSET"
          $archive = Join-Path $env:RUNNER_TEMP 'bsml.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'bsml') -Force

          $plugins = Join-Path $env:GITHUB_WORKSPACE 'Refs/Plugins'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'bsml/Plugins/BSML.dll') $plugins -Force

          Get-ChildItem 'Refs' | Select-Object Name
          Get-Item (Join-Path $plugins 'BSML.dll') | Select-Object Name, Length

      # The native converter needs MSVC; Native/build.ps1 locates it with vswhere.
      - name: Build plugin
        run: >
          dotnet build .\Japanese_IME.csproj -c Release
          -p:BeatSaberDir="${{ github.workspace }}\Refs"
          -p:DisableCopyToGame=True

      - name: Verify build output
        shell: pwsh
        run: |
          $artifact = 'bin/Release/Artifact'
          Get-ChildItem $artifact -Recurse -File | Select-Object FullName, Length

          $required = @(
            'Plugins/JapaneseIME.dll',
            'Plugins/JapaneseIME.KanjiHost.exe',
            'Libs/Natives/JapaneseIME.KanjiNative.dll'
          )

          $missing = $required | Where-Object { -not (Test-Path (Join-Path $artifact $_)) }
          if ($missing) {
            throw "Build output is missing: $($missing -join ', ')"
          }

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: JapaneseIME-${{ github.sha }}
          path: bin/Release/Artifact
          if-no-files-found: error

